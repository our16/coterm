name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.asset }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            script: package:windows
            asset: coterm-windows-x64.exe
            output: coterm.exe
            shell: pwsh
            verify: |
              Get-Item coterm.exe | Select-Object Name, Length
              .\coterm.exe --version
          - os: ubuntu-latest
            script: package:linux
            asset: coterm-linux-x64
            output: coterm
            shell: bash
            verify: |
              ls -la coterm
              ./coterm --version
          - os: macos-latest
            script: package:macos
            asset: coterm-macos-x64
            output: coterm
            shell: bash
            verify: |
              ls -la coterm
              ./coterm --version
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Typecheck
        run: bun run typecheck

      - name: Run tests
        run: bun test

      - name: Package ${{ matrix.os }}
        run: bun run ${{ matrix.script }}

      - name: Rename artifact
        run: mv ${{ matrix.output }} ${{ matrix.asset }}
        shell: ${{ matrix.shell }}

      - name: Verify artifact
        run: ${{ matrix.verify }}
        shell: ${{ matrix.shell }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}
          if-no-files-found: error

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract changelog section for this version
        id: changelog
        shell: bash
        run: |
          VER="${GITHUB_REF_NAME#v}"
          awk -v ver="$VER" '
            BEGIN { p = 0 }
            /^## / {
              if (p) exit
              if ($0 ~ "\\[" ver "\\]") p = 1
            }
            p { print }
          ' CHANGELOG.md > release_body.md
          echo "--- extracted body ---"
          head -c 400 release_body.md

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist-assets
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist-assets/*
          body_path: release_body.md
          generate_release_notes: true
